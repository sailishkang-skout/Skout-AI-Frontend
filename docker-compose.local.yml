# Local dev overlay — use with backend stack running
#
# 1. Start backend (from Skout AI Backend repo):
#    docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# 2. Start frontend (from this repo):
#    docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Loads API URL from .env.local (NEXT_PUBLIC_* baked at image build time).

services:
  web:
    env_file:
      - .env.local
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_CRM_API_URL: ${NEXT_PUBLIC_CRM_API_URL:-http://localhost:3002}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-custom}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_CRM_API_URL: ${NEXT_PUBLIC_CRM_API_URL:-http://localhost:3002}
