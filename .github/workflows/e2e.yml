name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skout
          POSTGRES_PASSWORD: skout
          POSTGRES_DB: skout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://skout:skout@localhost:5432/skout
      PLAYWRIGHT_API_URL: http://127.0.0.1:3001
      PLAYWRIGHT_CRM_API_URL: http://127.0.0.1:3002
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # Playwright drives the frontend from http://127.0.0.1:3000 — both APIs must
      # allow that origin (plus localhost for local dev) or the browser blocks every
      # cross-origin fetch → waitForApiMutation 30s timeouts → 15m CI cancellation.
      CORS_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
      # Long 32-test/1-worker runs hit the default 200 req/min rate limit → 429s.
      RATE_LIMIT_MAX: 100000
      CI: true
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Skout-AI-Backend
          ref: develop
          path: backend

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build backend packages
        working-directory: backend
        run: |
          pnpm --filter @skout/api^... build
          pnpm --filter @skout/crm^... build

      - name: Run database migrations
        working-directory: backend
        run: pnpm db:migrate

      - name: Start API (stub auth)
        working-directory: backend
        run: |
          AUTH_STUB=true CLERK_SECRET_KEY= REDIS_URL= CORS_ORIGIN="${CORS_ORIGIN}" pnpm --filter @skout/api dev > /tmp/skout-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/api/v1/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          tail -n 100 /tmp/skout-api.log
          exit 1

      - name: Start CRM API (stub auth)
        working-directory: backend
        run: |
          AUTH_STUB=true CLERK_SECRET_KEY= CORS_ORIGIN="${CORS_ORIGIN}" pnpm --filter @skout/crm dev > /tmp/skout-crm.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3002/api/v1/crm/health >/dev/null; then
              echo "CRM API ready"
              exit 0
            fi
            sleep 2
          done
          echo "CRM API failed to start"
          tail -n 100 /tmp/skout-crm.log
          exit 1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          E2E_AUTH_BYPASS: "true"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_CRM_API_URL: http://127.0.0.1:3002
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          PLAYWRIGHT_API_URL: http://127.0.0.1:3001
          PLAYWRIGHT_CRM_API_URL: http://127.0.0.1:3002
        run: pnpm exec playwright test --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
